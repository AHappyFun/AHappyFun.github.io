<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <style>
    text { fill: #c9d1d9; font-size: 12px; }
    .label { font-size: 11px; fill: #8b949e; }
    .title { font-size: 10px; fill: #8b949e; text-anchor: middle; }
  </style>

  <rect width="720" height="320" fill="#0d1117" rx="8"/>

  <!-- 单线排线 Single Hatching -->
  <g transform="translate(20, 20)">
    <rect width="155" height="120" fill="#161b22" rx="6" stroke="#30363d" stroke-width="1"/>
    <text x="77" y="16" class="title">单线排线 (Single Hatching)</text>
    <g transform="translate(10, 28)">
      <rect width="135" height="80" fill="#1c2128" rx="2"/>
      <line x1="5" y1="5" x2="60" y2="5" stroke="#8b949e" stroke-width="0.8" opacity="0.3"/>
      <line x1="5" y1="8" x2="60" y2="8" stroke="#8b949e" stroke-width="0.8" opacity="0.4"/>
      <line x1="5" y1="11" x2="60" y2="11" stroke="#8b949e" stroke-width="0.8" opacity="0.5"/>
      <line x1="5" y1="14" x2="60" y2="14" stroke="#8b949e" stroke-width="0.8" opacity="0.6"/>
      <line x1="5" y1="17" x2="60" y2="17" stroke="#8b949e" stroke-width="0.8" opacity="0.7"/>
      <!-- darker side -->
      <line x1="75" y1="5" x2="130" y2="5" stroke="#8b949e" stroke-width="0.8" opacity="0.5"/>
      <line x1="75" y1="7" x2="130" y2="7" stroke="#8b949e" stroke-width="0.8" opacity="0.6"/>
      <line x1="75" y1="9" x2="130" y2="9" stroke="#8b949e" stroke-width="0.8" opacity="0.7"/>
      <line x1="75" y1="11" x2="130" y2="11" stroke="#8b949e" stroke-width="0.8" opacity="0.8"/>
      <line x1="75" y1="13" x2="130" y2="13" stroke="#8b949e" stroke-width="0.8" opacity="0.9"/>
      <line x1="75" y1="15" x2="130" y2="15" stroke="#8b949e" stroke-width="0.8"/>
      <line x1="75" y1="17" x2="130" y2="17" stroke="#8b949e" stroke-width="0.8"/>
      <line x1="75" y1="19" x2="130" y2="19" stroke="#8b949e" stroke-width="0.8"/>
    </g>
    <text x="77" y="118" class="title">密度控制灰度</text>
  </g>

  <!-- 交叉排线 Cross-Hatching -->
  <g transform="translate(195, 20)">
    <rect width="155" height="120" fill="#161b22" rx="6" stroke="#30363d" stroke-width="1"/>
    <text x="77" y="16" class="title">交叉排线 (Cross-Hatching)</text>
    <g transform="translate(10, 28)">
      <rect width="135" height="80" fill="#1c2128" rx="2"/>
      <!-- 方向1 -->
      <line x1="5" y1="5" x2="60" y2="5" stroke="#8b949e" stroke-width="0.7" opacity="0.4"/>
      <line x1="5" y1="9" x2="60" y2="9" stroke="#8b949e" stroke-width="0.7" opacity="0.5"/>
      <line x1="5" y1="13" x2="60" y2="13" stroke="#8b949e" stroke-width="0.7" opacity="0.6"/>
      <line x1="5" y1="17" x2="60" y2="17" stroke="#8b949e" stroke-width="0.7" opacity="0.7"/>
      <!-- 方向2叠加 -->
      <line x1="5" y1="5" x2="5" y2="60" stroke="#8b949e" stroke-width="0.7" opacity="0.4"/>
      <line x1="15" y1="5" x2="15" y2="60" stroke="#8b949e" stroke-width="0.7" opacity="0.5"/>
      <line x1="25" y1="5" x2="25" y2="60" stroke="#8b949e" stroke-width="0.7" opacity="0.6"/>
      <line x1="35" y1="5" x2="35" y2="60" stroke="#8b949e" stroke-width="0.7" opacity="0.7"/>
      <line x1="45" y1="5" x2="45" y2="60" stroke="#8b949e" stroke-width="0.7" opacity="0.8"/>
      <!-- 右侧更密集 -->
      <line x1="80" y1="5" x2="130" y2="5" stroke="#8b949e" stroke-width="0.7" opacity="0.5"/>
      <line x1="80" y1="8" x2="130" y2="8" stroke="#8b949e" stroke-width="0.7" opacity="0.7"/>
      <line x1="80" y1="11" x2="130" y2="11" stroke="#8b949e" stroke-width="0.7" opacity="0.9"/>
      <line x1="80" y1="14" x2="130" y2="14" stroke="#8b949e" stroke-width="0.7"/>
      <line x1="80" y1="5" x2="80" y2="80" stroke="#8b949e" stroke-width="0.7" opacity="0.5"/>
      <line x1="88" y1="5" x2="88" y2="80" stroke="#8b949e" stroke-width="0.7" opacity="0.7"/>
      <line x1="96" y1="5" x2="96" y2="80" stroke="#8b949e" stroke-width="0.7" opacity="0.9"/>
      <line x1="104" y1="5" x2="104" y2="80" stroke="#8b949e" stroke-width="0.7"/>
      <line x1="112" y1="5" x2="112" y2="80" stroke="#8b949e" stroke-width="0.7"/>
      <line x1="120" y1="5" x2="120" y2="80" stroke="#8b949e" stroke-width="0.7"/>
    </g>
    <text x="77" y="118" class="title">多方向层叠获得更暗调子</text>
  </g>

  <!-- 曲线排线 Contour Hatching -->
  <g transform="translate(370, 20)">
    <rect width="155" height="120" fill="#161b22" rx="6" stroke="#30363d" stroke-width="1"/>
    <text x="77" y="16" class="title">曲线排线 (Contour Hatching)</text>
    <g transform="translate(10, 28)">
      <rect width="135" height="80" fill="#1c2128" rx="2"/>
      <!-- 球体曲线 -->
      <ellipse cx="67" cy="40" rx="40" ry="32" fill="none" stroke="#8b949e" stroke-width="0.6" opacity="0.3"/>
      <path d="M27,20 Q67,10 107,20" fill="none" stroke="#8b949e" stroke-width="0.7" opacity="0.5"/>
      <path d="M27,25 Q67,15 107,25" fill="none" stroke="#8b949e" stroke-width="0.7" opacity="0.5"/>
      <path d="M27,30 Q67,20 107,30" fill="none" stroke="#8b949e" stroke-width="0.7" opacity="0.6"/>
      <path d="M27,35 Q67,25 107,35" fill="none" stroke="#8b949e" stroke-width="0.7" opacity="0.7"/>
      <path d="M27,40 Q67,30 107,40" fill="none" stroke="#8b949e" stroke-width="0.7" opacity="0.8"/>
      <path d="M27,45 Q67,35 107,45" fill="none" stroke="#8b949e" stroke-width="0.7" opacity="0.85"/>
      <path d="M27,50 Q67,40 107,50" fill="none" stroke="#8b949e" stroke-width="0.7" opacity="0.9"/>
      <path d="M27,55 Q67,45 107,55" fill="none" stroke="#8b949e" stroke-width="0.7" opacity="0.95"/>
    </g>
    <text x="77" y="118" class="title">沿形面曲率增强体积</text>
  </g>

  <!-- 点状排线 Stippling -->
  <g transform="translate(545, 20)">
    <rect width="155" height="120" fill="#161b22" rx="6" stroke="#30363d" stroke-width="1"/>
    <text x="77" y="16" class="title">点状排线 (Stippling)</text>
    <g transform="translate(10, 28)">
      <rect width="135" height="80" fill="#1c2128" rx="2"/>
      <!-- 左侧稀疏点 -->
      <circle cx="20" cy="10" r="0.8" fill="#8b949e" opacity="0.3"/>
      <circle cx="35" cy="15" r="0.8" fill="#8b949e" opacity="0.3"/>
      <circle cx="28" cy="25" r="0.8" fill="#8b949e" opacity="0.35"/>
      <circle cx="40" cy="30" r="0.8" fill="#8b949e" opacity="0.35"/>
      <circle cx="22" cy="40" r="0.8" fill="#8b949e" opacity="0.4"/>
      <circle cx="45" cy="45" r="0.8" fill="#8b949e" opacity="0.4"/>
      <circle cx="30" cy="55" r="0.8" fill="#8b949e" opacity="0.45"/>
      <circle cx="38" cy="65" r="0.8" fill="#8b949e" opacity="0.45"/>
      <!-- 右侧密集点 -->
      <circle cx="80" cy="8" r="0.8" fill="#8b949e" opacity="0.6"/>
      <circle cx="90" cy="10" r="0.8" fill="#8b949e" opacity="0.7"/>
      <circle cx="85" cy="16" r="0.8" fill="#8b949e" opacity="0.7"/>
      <circle cx="95" cy="18" r="0.8" fill="#8b949e" opacity="0.8"/>
      <circle cx="100" cy="12" r="0.8" fill="#8b949e" opacity="0.8"/>
      <circle cx="82" cy="24" r="0.8" fill="#8b949e" opacity="0.75"/>
      <circle cx="92" cy="26" r="0.8" fill="#8b949e" opacity="0.85"/>
      <circle cx="102" cy="22" r="0.8" fill="#8b949e" opacity="0.85"/>
      <circle cx="88" cy="32" r="0.8" fill="#8b949e" opacity="0.8"/>
      <circle cx="98" cy="34" r="0.8" fill="#8b949e" opacity="0.9"/>
      <circle cx="106" cy="30" r="0.8" fill="#8b949e" opacity="0.9"/>
      <circle cx="84" cy="42" r="0.8" fill="#8b949e" opacity="0.85"/>
      <circle cx="94" cy="44" r="0.8" fill="#8b949e" opacity="0.95"/>
      <circle cx="104" cy="40" r="0.8" fill="#8b949e" opacity="0.95"/>
      <circle cx="110" cy="38" r="0.8" fill="#8b949e"/>
      <circle cx="90" cy="52" r="0.8" fill="#8b949e" opacity="0.9"/>
      <circle cx="100" cy="54" r="0.8" fill="#8b949e" opacity="0.95"/>
      <circle cx="108" cy="50" r="0.8" fill="#8b949e"/>
      <circle cx="96" cy="62" r="0.8" fill="#8b949e" opacity="0.95"/>
      <circle cx="106" cy="64" r="0.8" fill="#8b949e"/>
    </g>
    <text x="77" y="118" class="title">以点代线，逻辑一致</text>
  </g>

  <!-- 底部说明 -->
  <text x="360" y="170" class="title" font-size="10" fill="#484f58">四种基础排线类型的渐变示意 —— 左侧稀疏到右侧密集的灰度变化</text>

  <!-- Hatching Direction -->
  <g transform="translate(20, 185)">
    <rect width="330" height="120" fill="#161b22" rx="6" stroke="#30363d" stroke-width="1"/>
    <text x="165" y="16" class="title">排线方向对观感的影响</text>

    <!-- 45度 -->
    <g transform="translate(15, 30)">
      <rect width="65" height="70" fill="#1c2128" rx="2"/>
      <line x1="5" y1="5" x2="20" y2="20" stroke="#8b949e" stroke-width="0.8" opacity="0.4"/>
      <line x1="5" y1="10" x2="25" y2="30" stroke="#8b949e" stroke-width="0.8" opacity="0.4"/>
      <line x1="5" y1="15" x2="30" y2="40" stroke="#8b949e" stroke-width="0.8" opacity="0.4"/>
      <line x1="5" y1="20" x2="35" y2="50" stroke="#8b949e" stroke-width="0.8" opacity="0.4"/>
      <line x1="5" y1="25" x2="40" y2="60" stroke="#8b949e" stroke-width="0.8" opacity="0.4"/>
      <line x1="5" y1="30" x2="45" y2="70" stroke="#8b949e" stroke-width="0.8" opacity="0.4"/>
      <line x1="10" y1="5" x2="50" y2="45" stroke="#8b949e" stroke-width="0.8" opacity="0.4"/>
      <line x1="15" y1="5" x2="55" y2="45" stroke="#8b949e" stroke-width="0.8" opacity="0.4"/>
      <line x1="20" y1="5" x2="60" y2="45" stroke="#8b949e" stroke-width="0.8" opacity="0.4"/>
      <text x="32" y="68" class="title">斜 45°（通用）</text>
    </g>

    <!-- 垂直 -->
    <g transform="translate(95, 30)">
      <rect width="65" height="70" fill="#1c2128" rx="2"/>
      <line x1="5" y1="5" x2="5" y2="65" stroke="#8b949e" stroke-width="0.8" opacity="0.4"/>
      <line x1="12" y1="5" x2="12" y2="65" stroke="#8b949e" stroke-width="0.8" opacity="0.4"/>
      <line x1="19" y1="5" x2="19" y2="65" stroke="#8b949e" stroke-width="0.8" opacity="0.4"/>
      <line x1="26" y1="5" x2="26" y2="65" stroke="#8b949e" stroke-width="0.8" opacity="0.4"/>
      <line x1="33" y1="5" x2="33" y2="65" stroke="#8b949e" stroke-width="0.8" opacity="0.4"/>
      <line x1="40" y1="5" x2="40" y2="65" stroke="#8b949e" stroke-width="0.8" opacity="0.4"/>
      <line x1="47" y1="5" x2="47" y2="65" stroke="#8b949e" stroke-width="0.8" opacity="0.4"/>
      <line x1="54" y1="5" x2="54" y2="65" stroke="#8b949e" stroke-width="0.8" opacity="0.4"/>
      <text x="32" y="68" class="title">垂直（立面）</text>
    </g>

    <!-- 水平 -->
    <g transform="translate(175, 30)">
      <rect width="65" height="70" fill="#1c2128" rx="2"/>
      <line x1="5" y1="5" x2="60" y2="5" stroke="#8b949e" stroke-width="0.8" opacity="0.4"/>
      <line x1="5" y1="12" x2="60" y2="12" stroke="#8b949e" stroke-width="0.8" opacity="0.4"/>
      <line x1="5" y1="19" x2="60" y2="19" stroke="#8b949e" stroke-width="0.8" opacity="0.4"/>
      <line x1="5" y1="26" x2="60" y2="26" stroke="#8b949e" stroke-width="0.8" opacity="0.4"/>
      <line x1="5" y1="33" x2="60" y2="33" stroke="#8b949e" stroke-width="0.8" opacity="0.4"/>
      <line x1="5" y1="40" x2="60" y2="40" stroke="#8b949e" stroke-width="0.8" opacity="0.4"/>
      <line x1="5" y1="47" x2="60" y2="47" stroke="#8b949e" stroke-width="0.8" opacity="0.4"/>
      <line x1="5" y1="54" x2="60" y2="54" stroke="#8b949e" stroke-width="0.8" opacity="0.4"/>
      <text x="32" y="68" class="title">水平（延展）</text>
    </g>

    <!-- 多角度交叉 -->
    <g transform="translate(255, 30)">
      <rect width="65" height="70" fill="#1c2128" rx="2"/>
      <line x1="5" y1="5" x2="60" y2="60" stroke="#8b949e" stroke-width="0.7" opacity="0.5"/>
      <line x1="10" y1="5" x2="60" y2="55" stroke="#8b949e" stroke-width="0.7" opacity="0.5"/>
      <line x1="5" y1="10" x2="55" y2="60" stroke="#8b949e" stroke-width="0.7" opacity="0.5"/>
      <line x1="55" y1="5" x2="5" y2="55" stroke="#8b949e" stroke-width="0.7" opacity="0.6"/>
      <line x1="60" y1="10" x2="10" y2="60" stroke="#8b949e" stroke-width="0.7" opacity="0.6"/>
      <line x1="60" y1="5" x2="5" y2="60" stroke="#8b949e" stroke-width="0.7" opacity="0.6"/>
      <line x1="5" y1="25" x2="60" y2="25" stroke="#8b949e" stroke-width="0.7" opacity="0.4"/>
      <line x1="5" y1="35" x2="60" y2="35" stroke="#8b949e" stroke-width="0.7" opacity="0.4"/>
      <text x="32" y="68" class="title">多角度交叉（深暗）</text>
    </g>
  </g>

  <!-- Cross-hatching in detail -->
  <g transform="translate(370, 185)">
    <rect width="330" height="120" fill="#161b22" rx="6" stroke="#30363d" stroke-width="1"/>
    <text x="165" y="16" class="title">丢勒排线的四种功能（同一画面中共存）</text>

    <g transform="translate(12, 28)">
      <!-- 轮廓线 -->
      <rect width="150" height="38" fill="#1c2128" rx="2"/>
      <path d="M10,15 L30,8 L65,12 L95,10 L130,7 L140,14 L135,22 L100,28 L55,25 L20,30 Z" fill="none" stroke="#e3b341" stroke-width="1.2"/>
      <text x="75" y="34" class="title">轮廓线（边界）</text>
    </g>

    <g transform="translate(168, 28)">
      <!-- 形面线 -->
      <rect width="150" height="38" fill="#1c2128" rx="2"/>
      <path d="M10,15 Q30,5 60,16 Q90,27 120,15 Q135,9 140,14" fill="none" stroke="#58a6ff" stroke-width="1"/>
      <path d="M10,22 Q30,12 60,23 Q90,34 120,22 Q135,16 140,19" fill="none" stroke="#58a6ff" stroke-width="0.8"/>
      <text x="75" y="34" class="title">形面线（体积）</text>
    </g>

    <g transform="translate(12, 72)">
      <!-- 调子线 -->
      <rect width="150" height="38" fill="#1c2128" rx="2"/>
      <line x1="10" y1="8" x2="60" y2="8" stroke="#8b949e" stroke-width="0.6" opacity="0.3"/>
      <line x1="10" y1="12" x2="60" y2="12" stroke="#8b949e" stroke-width="0.6" opacity="0.4"/>
      <line x1="10" y1="16" x2="60" y2="16" stroke="#8b949e" stroke-width="0.6" opacity="0.5"/>
      <line x1="10" y1="20" x2="60" y2="20" stroke="#8b949e" stroke-width="0.6" opacity="0.6"/>
      <line x1="80" y1="8" x2="140" y2="8" stroke="#8b949e" stroke-width="0.6" opacity="0.5"/>
      <line x1="80" y1="11" x2="140" y2="11" stroke="#8b949e" stroke-width="0.6" opacity="0.7"/>
      <line x1="80" y1="14" x2="140" y2="14" stroke="#8b949e" stroke-width="0.6" opacity="0.85"/>
      <line x1="80" y1="17" x2="140" y2="17" stroke="#8b949e" stroke-width="0.6"/>
      <text x="75" y="34" class="title">调子线（明暗）</text>
    </g>

    <g transform="translate(168, 72)">
      <!-- 材质线 -->
      <rect width="150" height="38" fill="#1c2128" rx="2"/>
      <!-- 细密线 - 皮肤质感 -->
      <line x1="10" y1="5" x2="55" y2="5" stroke="#8b949e" stroke-width="0.4" opacity="0.3"/>
      <line x1="10" y1="8" x2="55" y2="8" stroke="#8b949e" stroke-width="0.4" opacity="0.35"/>
      <line x1="10" y1="11" x2="55" y2="11" stroke="#8b949e" stroke-width="0.4" opacity="0.4"/>
      <!-- 粗曲线 - 布料 -->
      <path d="M70,5 Q85,12 70,15" fill="none" stroke="#8b949e" stroke-width="1" opacity="0.6"/>
      <path d="M80,5 Q95,12 80,15" fill="none" stroke="#8b949e" stroke-width="1" opacity="0.6"/>
      <path d="M90,5 Q105,12 90,15" fill="none" stroke="#8b949e" stroke-width="1" opacity="0.6"/>
      <!-- 垂直交叉 - 金属 -->
      <line x1="110" y1="5" x2="125" y2="5" stroke="#8b949e" stroke-width="0.5" opacity="0.7"/>
      <line x1="110" y1="8" x2="125" y2="8" stroke="#8b949e" stroke-width="0.5" opacity="0.7"/>
      <line x1="110" y1="5" x2="110" y2="15" stroke="#8b949e" stroke-width="0.5" opacity="0.7"/>
      <line x1="118" y1="5" x2="118" y2="15" stroke="#8b949e" stroke-width="0.5" opacity="0.7"/>
      <text x="75" y="34" class="title">材质线（质感区分）</text>
    </g>
  </g>
</svg>
