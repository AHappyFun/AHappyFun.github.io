<line x1="140.0" y1="440.0" x2="1000.0" y2="440.0" stroke="#6f6a60" stroke-opacity="0.9" stroke-width="1.4"/>
<line x1="140.0" y1="440.0" x2="140.0" y2="120.0" stroke="#6f6a60" stroke-opacity="0.9" stroke-width="1.4"/>
<text x="1005.0" y="446.0" fill="#b9b2a4" font-size="10.5" text-anchor="start" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC',SimSun,serif">数量 Q</text>
<text x="150.0" y="114.0" fill="#b9b2a4" font-size="10.5" text-anchor="start" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC',SimSun,serif">价格 P</text>
<polygon points="1000.0,440.0 991.0,435.5 991.0,444.5" fill="#6f6a60" fill-opacity="0.9"/>
<polygon points="140.0,120.0 135.5,129.0 144.5,129.0" fill="#6f6a60" fill-opacity="0.9"/>
<path d="M 200.0 195.0 L 900.0 440.0" fill="none" stroke="#5e80b2" stroke-width="2.2"/>
<path d="M 392.0 202.8 L 652.0 436.8" fill="none" stroke="#9e454d" stroke-width="2.2"/>
<line x1="140.0" y1="300.0" x2="1000.0" y2="300.0" stroke="#6f6a60" stroke-opacity="0.6" stroke-width="1" stroke-dasharray="5 4"/>
<text x="150.0" y="294.0" fill="#b9b2a4" font-size="11" text-anchor="start" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC',SimSun,serif">P1</text>
<line x1="140.0" y1="220.0" x2="1000.0" y2="220.0" stroke="#c9a86a" stroke-opacity="0.85" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="150.0" y="214.0" fill="#c9a86a" font-size="11" text-anchor="start" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC',SimSun,serif">P2 涨价后</text>
<line x1="271.4" y1="220.0" x2="271.4" y2="440.0" stroke="#5e80b2" stroke-opacity="0.45" stroke-width="1" stroke-dasharray="3 4"/>
