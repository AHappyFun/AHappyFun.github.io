<text x="415.1" y="460.0" fill="#9e454d" font-size="11" text-anchor="middle" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC',SimSun,serif">Q_僵</text>
<circle cx="500.0" cy="300.0" r="4.2" fill="#f2ece0" fill-opacity="1.0"/>
<text x="500.0" y="460.0" fill="#f2ece0" font-size="11" text-anchor="middle" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC',SimSun,serif">Q1</text>
<text x="888.0" y="423.8" fill="#5e80b2" font-size="11.5" text-anchor="end" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC',SimSun,serif">需求（弹性大）</text>
<text x="640.0" y="414.0" fill="#9e454d" font-size="11.5" text-anchor="end" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC',SimSun,serif">需求（缺乏弹性）</text>
<line x1="56.0" y1="462.0" x2="1000.0" y2="462.0" stroke="#3a3630" stroke-opacity="0.7" stroke-width="1"/>
<text x="56.0" y="484.0" fill="#b9b2a4" font-size="11.5" text-anchor="start" font-style="italic" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC',SimSun,serif">弹性小的那一侧，涨价几乎不丢销量；弹性大的那一侧，涨价就是给对手送客户。</text>
