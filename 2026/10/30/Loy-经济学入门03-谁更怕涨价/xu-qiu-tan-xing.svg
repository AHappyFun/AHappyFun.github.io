<text x="267.4" y="460.0" fill="#5e80b2" font-size="11" text-anchor="middle" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC',SimSun,serif">Q_弹</text>
<line x1="411.1" y1="220.0" x2="411.1" y2="440.0" stroke="#9e454d" stroke-opacity="0.45" stroke-width="1" stroke-dasharray="3 4"/>
