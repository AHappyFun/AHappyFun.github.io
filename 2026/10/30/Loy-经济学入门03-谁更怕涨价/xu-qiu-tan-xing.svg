<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 500" width="1080" height="500" role="img">
<rect x="0.0" y="0.0" width="1080.0" height="500.0" rx="0" fill="#131318" fill-opacity="1.0"/>
<line x1="56.0" y1="92.0" x2="152.0" y2="92.0" stroke="#c9a86a" stroke-opacity="0.55" stroke-width="1.4"/>
<text x="56.0" y="44.0" fill="#c9a86a" font-size="17" text-anchor="start" font-weight="600" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC',SimSun,serif">同一次涨价，两种命运：弹性决定客户跑不跑</text>
<text x="56.0" y="70.0" fill="#6f6a60" font-size="11" text-anchor="start" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC',SimSun,serif">两条需求曲线从同一个均衡点出发；价格从 P1 抬到 P2，销量掉的幅度完全不同</text>
<line x1="140.0" y1="200.0" x2="1000.0" y2="200.0" stroke="#3a3630" stroke-opacity="0.5" stroke-width="1" stroke-dasharray="2 6"/>
