<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="880" viewBox="0 0 1400 880" role="img" aria-labelledby="title desc">
  <title id="title">电子游戏美术风格的五层结构</title>
  <desc id="desc">从世界题材、视觉语言、媒介形态、渲染表面到游戏条件，五层共同组成可生产的游戏美术方向。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f5ee"/>
      <stop offset="1" stop-color="#ebe5d9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#2e2923" flood-opacity="0.15"/>
    </filter>
    <style>
      .title { font:700 38px 'Microsoft YaHei','PingFang SC',sans-serif; fill:#28241f; }
      .sub { font:400 19px 'Microsoft YaHei','PingFang SC',sans-serif; fill:#665f54; }
      .num { font:700 30px 'Microsoft YaHei','PingFang SC',sans-serif; fill:#fff; }
      .head { font:700 26px 'Microsoft YaHei','PingFang SC',sans-serif; fill:#2d2923; }
      .question { font:600 19px 'Microsoft YaHei','PingFang SC',sans-serif; fill:#5c554b; }
      .body { font:400 17px 'Microsoft YaHei','PingFang SC',sans-serif; fill:#625b51; }
      .arrow { stroke:#9b9183; stroke-width:3; fill:none; marker-end:url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9b9183"/>
    </marker>
  </defs>
  <rect width="1400" height="880" rx="32" fill="url(#bg)"/>
  <text x="700" y="62" text-anchor="middle" class="title">电子游戏美术风格的五层结构</text>
  <text x="700" y="96" text-anchor="middle" class="sub">一款游戏不是只选一个“画风名”，而是在五层上分别作出选择</text>

  <path d="M 265 438 L 343 438" class="arrow"/>
  <path d="M 525 438 L 603 438" class="arrow"/>
  <path d="M 785 438 L 863 438" class="arrow"/>
  <path d="M 1045 438 L 1123 438" class="arrow"/>

  <g filter="url(#shadow)">
    <rect x="85" y="245" width="180" height="386" rx="26" fill="#e8d7c9"/>
    <circle cx="175" cy="292" r="30" fill="#9a654b"/>
    <text x="175" y="302" text-anchor="middle" class="num">1</text>
    <text x="175" y="355" text-anchor="middle" class="head">世界题材</text>
    <text x="175" y="392" text-anchor="middle" class="question">画什么世界？</text>
    <text x="175" y="446" text-anchor="middle" class="body">暗黑幻想</text>
    <text x="175" y="478" text-anchor="middle" class="body">赛博朋克</text>
    <text x="175" y="510" text-anchor="middle" class="body">田园 / 末日</text>
    <text x="175" y="542" text-anchor="middle" class="body">东方幻想</text>
    <text x="175" y="574" text-anchor="middle" class="body">太空歌剧</text>

    <rect x="345" y="205" width="180" height="466" rx="26" fill="#d9e4d8"/>
    <circle cx="435" cy="252" r="30" fill="#54765e"/>
    <text x="435" y="262" text-anchor="middle" class="num">2</text>
    <text x="435" y="315" text-anchor="middle" class="head">视觉语言</text>
    <text x="435" y="352" text-anchor="middle" class="question">怎样概括？</text>
    <text x="435" y="406" text-anchor="middle" class="body">写实 / 夸张</text>
    <text x="435" y="438" text-anchor="middle" class="body">圆 / 方 / 尖</text>
    <text x="435" y="470" text-anchor="middle" class="body">比例与轮廓</text>
    <text x="435" y="502" text-anchor="middle" class="body">色板与明度</text>
    <text x="435" y="534" text-anchor="middle" class="body">细节密度</text>
    <text x="435" y="566" text-anchor="middle" class="body">边缘与笔触</text>

    <rect x="605" y="165" width="180" height="546" rx="26" fill="#d7ddec"/>
    <circle cx="695" cy="212" r="30" fill="#566c9a"/>
    <text x="695" y="222" text-anchor="middle" class="num">3</text>
    <text x="695" y="275" text-anchor="middle" class="head">媒介形态</text>
    <text x="695" y="312" text-anchor="middle" class="question">怎样存在？</text>
    <text x="695" y="366" text-anchor="middle" class="body">2D 手绘</text>
    <text x="695" y="398" text-anchor="middle" class="body">像素 / Sprite</text>
    <text x="695" y="430" text-anchor="middle" class="body">全 3D</text>
    <text x="695" y="462" text-anchor="middle" class="body">2.5D 混合</text>
    <text x="695" y="494" text-anchor="middle" class="body">体素</text>
    <text x="695" y="526" text-anchor="middle" class="body">实物扫描</text>
    <text x="695" y="558" text-anchor="middle" class="body">微缩 / 拼贴</text>

    <rect x="865" y="205" width="180" height="466" rx="26" fill="#eadbbf"/>
    <circle cx="955" cy="252" r="30" fill="#9a7a42"/>
    <text x="955" y="262" text-anchor="middle" class="num">4</text>
    <text x="955" y="315" text-anchor="middle" class="head">渲染表面</text>
    <text x="955" y="352" text-anchor="middle" class="question">光与材质？</text>
    <text x="955" y="406" text-anchor="middle" class="body">PBR</text>
    <text x="955" y="438" text-anchor="middle" class="body">卡通色阶</text>
    <text x="955" y="470" text-anchor="middle" class="body">手绘贴图</text>
    <text x="955" y="502" text-anchor="middle" class="body">描边 / 网点</text>
    <text x="955" y="534" text-anchor="middle" class="body">像素化 / 抖色</text>
    <text x="955" y="566" text-anchor="middle" class="body">后处理</text>

    <rect x="1125" y="245" width="190" height="386" rx="26" fill="#dfd7e7"/>
    <circle cx="1220" cy="292" r="30" fill="#725e88"/>
    <text x="1220" y="302" text-anchor="middle" class="num">5</text>
    <text x="1220" y="355" text-anchor="middle" class="head">游戏条件</text>
    <text x="1220" y="392" text-anchor="middle" class="question">玩家怎样看？</text>
    <text x="1220" y="446" text-anchor="middle" class="body">镜头距离</text>
    <text x="1220" y="478" text-anchor="middle" class="body">战斗速度</text>
    <text x="1220" y="510" text-anchor="middle" class="body">交互可读性</text>
    <text x="1220" y="542" text-anchor="middle" class="body">平台性能</text>
    <text x="1220" y="574" text-anchor="middle" class="body">团队产能</text>
  </g>

  <rect x="270" y="770" width="860" height="58" rx="29" fill="#5b5145"/>
  <text x="700" y="807" text-anchor="middle" style="font:600 20px 'Microsoft YaHei','PingFang SC',sans-serif;fill:#fff">五层组合以后，才得到一套可以执行和重复生产的游戏美术方向</text>
</svg>

