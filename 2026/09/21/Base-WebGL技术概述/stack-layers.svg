<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="950" viewBox="0 0 1400 950" role="img" aria-labelledby="title desc">
  <title id="title">Web 渲染技术栈层级图</title>
  <desc id="desc">底层是浏览器提供的图形 API 与运行时（WebGL、WebGPU、WASM），中层是各引擎的 Runtime，上层是官方或开源的 Editor 与工具链。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f5ef"/>
      <stop offset="1" stop-color="#eee8dc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#3b342a" flood-opacity="0.13"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a7c66"/>
    </marker>
    <style>
      .title { font: 700 38px 'Microsoft YaHei','PingFang SC',sans-serif; fill:#28241e; }
      .sub { font: 400 20px 'Microsoft YaHei','PingFang SC',sans-serif; fill:#665f54; }
      .bandhead { font: 700 23px 'Microsoft YaHei','PingFang SC',sans-serif; fill:#3a342b; }
      .cardhead { font: 700 21px 'Microsoft YaHei','PingFang SC',sans-serif; fill:#4a4237; }
      .cardhead-s { font: 700 20px 'Microsoft YaHei','PingFang SC',sans-serif; fill:#4a4237; }
      .body { font: 400 18px 'Microsoft YaHei','PingFang SC',sans-serif; fill:#5a5348; }
      .body-s { font: 400 17px 'Microsoft YaHei','PingFang SC',sans-serif; fill:#5a5348; }
      .arrowlabel { font: 400 17px 'Microsoft YaHei','PingFang SC',sans-serif; fill:#6b5f4e; }
    </style>
  </defs>
  <rect width="1400" height="950" rx="32" fill="url(#bg)"/>
  <text x="700" y="60" text-anchor="middle" class="title">Web 渲染技术栈的三个层级</text>
  <text x="700" y="94" text-anchor="middle" class="sub">所有引擎共享同一层浏览器 API，差距在 Runtime 能力与 Editor 完成度</text>

  <!-- ═══ 上层：Editor / 工具链 ═══ -->
  <g filter="url(#shadow)">
    <rect x="70" y="136" width="1260" height="238" rx="24" fill="#f2e6c8" stroke="#d9c691" stroke-width="2"/>
  </g>
  <text x="110" y="176" class="bandhead">Editor / 工具链层 · 官方编辑器与开源工具</text>
  <g>
    <rect x="80" y="200" width="295" height="150" rx="14" fill="#fdfbf5" stroke="#d9c691" stroke-width="1.5"/>
    <text x="227" y="234" text-anchor="middle" class="cardhead-s">云编辑器 · 引擎自带</text>
    <text x="227" y="266" text-anchor="middle" class="body-s">PlayCanvas Editor v2</text>
    <text x="227" y="294" text-anchor="middle" class="body-s">Cocos Creator · LayaAir IDE</text>
    <text x="227" y="322" text-anchor="middle" class="body-s">Wonderland Editor</text>
  </g>
  <g>
    <rect x="395" y="200" width="295" height="150" rx="14" fill="#fdfbf5" stroke="#d9c691" stroke-width="1.5"/>
    <text x="542" y="234" text-anchor="middle" class="cardhead-s">浏览器内工具 · 官方</text>
    <text x="542" y="266" text-anchor="middle" class="body-s">Babylon Playground</text>
    <text x="542" y="294" text-anchor="middle" class="body-s">Inspector · NME</text>
    <text x="542" y="322" text-anchor="middle" class="body-s">Node Render Graph</text>
  </g>
  <g>
    <rect x="710" y="200" width="295" height="150" rx="14" fill="#fdfbf5" stroke="#d9c691" stroke-width="1.5"/>
    <text x="857" y="234" text-anchor="middle" class="cardhead-s">原生编辑器 · 导出 Web</text>
    <text x="857" y="266" text-anchor="middle" class="body-s">Unity Editor</text>
    <text x="857" y="294" text-anchor="middle" class="body-s">Godot Editor</text>
    <text x="857" y="322" text-anchor="middle" class="body-s">（不运行在浏览器里）</text>
  </g>
  <g>
    <rect x="1025" y="200" width="295" height="150" rx="14" fill="#fdfbf5" stroke="#d9c691" stroke-width="1.5"/>
    <text x="1172" y="234" text-anchor="middle" class="cardhead-s">社区生态补位</text>
    <text x="1172" y="266" text-anchor="middle" class="body-s">React Three Fiber</text>
    <text x="1172" y="294" text-anchor="middle" class="body-s">Spline 等三方工具</text>
    <text x="1172" y="322" text-anchor="middle" class="body-s">（Three.js 无官方编辑器）</text>
  </g>

  <!-- 编辑器 ↔ Runtime 双向箭头 -->
  <line x1="350" y1="384" x2="350" y2="410" stroke="#8a7c66" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="366" y="401" class="arrowlabel">工程 / 资产 下发</text>
  <line x1="1050" y1="410" x2="1050" y2="384" stroke="#8a7c66" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="1034" y="401" text-anchor="end" class="arrowlabel">调试 / 预览 联动</text>

  <!-- ═══ 中层：引擎 Runtime ═══ -->
  <g filter="url(#shadow)">
    <rect x="70" y="414" width="1260" height="268" rx="24" fill="#e9e4f2" stroke="#c9bfe0" stroke-width="2"/>
  </g>
  <text x="110" y="454" class="bandhead">引擎 Runtime 层 · 渲染 / 场景 / 资产管线</text>
  <g>
    <rect x="80" y="478" width="400" height="180" rx="14" fill="#fdfbf5" stroke="#c9bfe0" stroke-width="1.5"/>
    <text x="280" y="516" text-anchor="middle" class="cardhead">Web 原生引擎</text>
    <text x="280" y="552" text-anchor="middle" class="body">Three.js · Babylon.js</text>
    <text x="280" y="580" text-anchor="middle" class="body">PlayCanvas Engine</text>
    <text x="280" y="608" text-anchor="middle" class="body">JS/TS 实现，Web 一等公民</text>
    <text x="280" y="636" text-anchor="middle" class="body">启动快、包体小，可 tree-shaking</text>
  </g>
  <g>
    <rect x="500" y="478" width="400" height="180" rx="14" fill="#fdfbf5" stroke="#c9bfe0" stroke-width="1.5"/>
    <text x="700" y="516" text-anchor="middle" class="cardhead">原生引擎移植</text>
    <text x="700" y="552" text-anchor="middle" class="body">Unity（WASM + WebGL2 导出）</text>
    <text x="700" y="580" text-anchor="middle" class="body">Godot（Compatibility 渲染器）</text>
    <text x="700" y="608" text-anchor="middle" class="body">UE（Pixel Streaming 云渲染）</text>
    <text x="700" y="636" text-anchor="middle" class="body">功能全，但体积与启动是代价</text>
  </g>
  <g>
    <rect x="920" y="478" width="400" height="180" rx="14" fill="#fdfbf5" stroke="#c9bfe0" stroke-width="1.5"/>
    <text x="1120" y="516" text-anchor="middle" class="cardhead">国产 / 垂直特化</text>
    <text x="1120" y="552" text-anchor="middle" class="body">Cocos · LayaAir · Galacean（小游戏）</text>
    <text x="1120" y="580" text-anchor="middle" class="body">Wonderland（WebXR）</text>
    <text x="1120" y="608" text-anchor="middle" class="body">Filament（嵌入式 PBR 库）</text>
    <text x="1120" y="636" text-anchor="middle" class="body">按平台约束取舍能力</text>
  </g>

  <!-- Runtime → API 调用箭头 -->
  <line x1="450" y1="690" x2="450" y2="718" stroke="#8a7c66" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="700" y="710" text-anchor="middle" class="arrowlabel">调用图形 API 与计算能力</text>
  <line x1="950" y1="690" x2="950" y2="718" stroke="#8a7c66" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- ═══ 底层：图形 API / 运行时 ═══ -->
  <g filter="url(#shadow)">
    <rect x="70" y="722" width="1260" height="198" rx="24" fill="#dbe8e0" stroke="#b4cdbd" stroke-width="2"/>
  </g>
  <text x="110" y="762" class="bandhead">图形 API / 运行时层 · 浏览器提供的能力边界</text>
  <g>
    <rect x="80" y="786" width="400" height="110" rx="14" fill="#fdfbf5" stroke="#b4cdbd" stroke-width="1.5"/>
    <text x="280" y="822" text-anchor="middle" class="cardhead">WebGL / WebGL 2</text>
    <text x="280" y="854" text-anchor="middle" class="body">2011 / 2013 年发布，全浏览器兼容</text>
    <text x="280" y="882" text-anchor="middle" class="body">只能光栅化绘制，无 Compute</text>
  </g>
  <g>
    <rect x="500" y="786" width="400" height="110" rx="14" fill="#fdfbf5" stroke="#b4cdbd" stroke-width="1.5"/>
    <text x="700" y="822" text-anchor="middle" class="cardhead">WebGPU</text>
    <text x="700" y="854" text-anchor="middle" class="body">2023 年起浏览器陆续稳定支持</text>
    <text x="700" y="882" text-anchor="middle" class="body">Compute Shader，能力接近原生 API</text>
  </g>
  <g>
    <rect x="920" y="786" width="400" height="110" rx="14" fill="#fdfbf5" stroke="#b4cdbd" stroke-width="1.5"/>
    <text x="1120" y="822" text-anchor="middle" class="cardhead">WebAssembly 运行时</text>
    <text x="1120" y="854" text-anchor="middle" class="body">SIMD · 线程 · Memory64</text>
    <text x="1120" y="882" text-anchor="middle" class="body">移植型引擎的承载层，决定启动体验</text>
  </g>
</svg>
